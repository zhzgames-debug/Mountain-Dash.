name: Build Mountain Dash APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract Mountain Dash project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)
          echo "Using ZIP: $ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mountain-Dash-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
